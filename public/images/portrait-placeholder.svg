<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1222"/>
      <stop offset="50%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <radialGradient id="rimGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="600" rx="24" fill="url(#bgGrad)"/>
  <rect width="500" height="600" rx="24" fill="url(#rimGlow)"/>
  <rect x="1" y="1" width="498" height="598" rx="23" stroke="url(#accentBorder)" stroke-width="2"/>

  <!-- Subtle grid/tech background elements -->
  <g opacity="0.1" stroke="#38BDF8" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="600" stroke-dasharray="4 8"/>
    <line x1="450" y1="0" x2="450" y2="600" stroke-dasharray="4 8"/>
    <line x1="0" y1="500" x2="500" y2="500" stroke-dasharray="4 8"/>
  </g>

  <!-- Silhouette Portrait -->
  <g transform="translate(0, 30)">
    <!-- Shoulders / Torso -->
    <path d="M110 500 C120 390 170 340 250 340 C330 340 380 390 390 500 Z" fill="url(#silhouetteGrad)"/>
    
    <!-- Neck -->
    <rect x="225" y="270" width="50" height="85" rx="10" fill="url(#silhouetteGrad)"/>

    <!-- Head -->
    <ellipse cx="250" cy="210" rx="70" ry="90" fill="url(#silhouetteGrad)"/>

    <!-- Hair contour silhouette -->
    <path d="M175 210 C175 120 205 105 250 105 C295 105 325 120 325 210 C325 240 315 285 305 310 C290 295 280 280 270 280 C230 280 220 295 195 310 C185 285 175 240 175 210 Z" fill="#0A0F1D" opacity="0.7"/>

    <!-- Subtle rim highlight on silhouette -->
    <path d="M180 210 C180 130 210 115 250 115" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M115 500 C125 395 170 350 240 345" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Clean Floating Badge: Ready for Portrait -->
  <g transform="translate(130, 485)">
    <rect width="240" height="42" rx="21" fill="#070A12" fill-opacity="0.9" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="28" cy="21" r="5" fill="#10B981"/>
    <text x="44" y="26" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">Professional Portrait</text>
  </g>
</svg>
